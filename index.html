<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Every Day — Персональный веб-тренажёр</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --bg-page: #FAF9F6;
      --bg-subtle: #F4F2EC;
      --bg-card: #FFFFFF;
      --text-main: #2D2E32;
      --text-muted: #6E717A;
      --lavender: #EFEAFD;
      --lavender-dark: #5B3FD9;
      --mint: #E5F6EE;
      --mint-dark: #1E7F53;
      --sky: #E6F1FC;
      --sky-dark: #236AB9;
      --cream: #FEF6DF;
      --cream-dark: #A56F08;
      --peach-pink: #FDECEB;
      --peach-pink-dark: #C84444;
      --apricot: #FDECE0;
      --apricot-dark: #C25E24;
      --sage: #A8DFC0;
      --sage-dark: #1A5736;
      --shadow-soft: 0 6px 24px rgba(45, 46, 50, 0.05), 0 1px 3px rgba(45, 46, 50, 0.03);
      --shadow-hover: 0 10px 28px rgba(45, 46, 50, 0.08), 0 2px 6px rgba(45, 46, 50, 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      margin: 0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--bg-card);
      border-radius: 22px;
      box-shadow: var(--shadow-soft);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-interactive:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .pill {
      border-radius: 999px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Flashcard 3D flip */
    .flip-scene {
      perspective: 1100px;
    }
    .flip-card {
      position: relative;
      width: 100%;
      min-height: 270px;
      transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .flip-card.is-flipped {
      transform: rotateY(180deg);
    }
    .flip-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 28px 24px;
      text-align: center;
      box-shadow: var(--shadow-soft);
    }
    .flip-back {
      transform: rotateY(180deg);
    }

    /* Subtle animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeIn 0.24s ease-out;
    }

    .tab-btn {
      white-space: nowrap;
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .tab-btn:hover {
      background: rgba(45, 46, 50, 0.05);
      color: var(--text-main);
    }
    .tab-btn.active {
      color: var(--text-main);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(45, 46, 50, 0.06);
    }

    /* Form controls */
    .input-soft {
      width: 100%;
      background: #F7F6F2;
      border: 1.5px solid transparent;
      border-radius: 16px;
      padding: 11px 15px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.18s ease, background-color 0.18s ease;
      font-family: inherit;
    }
    .input-soft:focus {
      background: #FFFFFF;
      border-color: #C7B9F6;
    }

    .btn-primary {
      background: #2D2E32;
      color: #FFFFFF;
      border-radius: 999px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #1C1D20;
    }
    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-soft {
      background: #F3F1EC;
      color: var(--text-main);
      border-radius: 999px;
      padding: 9px 16px;
      font-weight: 600;
      font-size: 13.5px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, transform 0.15s ease;
      cursor: pointer;
    }
    .btn-soft:hover {
      background: #E9E6DE;
    }

    /* Modal backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(45, 46, 50, 0.36);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.18s ease-out;
    }
    .modal-panel {
      background: #FFFFFF;
      border-radius: 26px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 24px 60px rgba(45, 46, 50, 0.18);
      padding: 24px;
    }

    .cheatsheet-body h2 {
      font-size: 16px;
      font-weight: 800;
      margin: 12px 0 6px;
      color: #2D2E32;
    }
    .cheatsheet-body ul {
      list-style: disc;
      padding-left: 20px;
      margin: 6px 0;
    }
    .cheatsheet-body li {
      margin-bottom: 4px;
    }
    .cheatsheet-body p {
      margin: 6px 0;
    }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Top Header -->
    <header class="sticky top-0 z-30 bg-[#FAF9F6]/90 backdrop-blur-md border-b border-black/[0.04]">
      <div class="max-w-6xl mx-auto px-4 pt-3 pb-2">
        <div class="flex items-center justify-between gap-3 flex-wrap">
          <div class="flex items-center gap-3">
            <button type="button" id="brand-flag-btn" class="w-10 h-10 rounded-2xl bg-white flex items-center justify-center shadow-sm overflow-hidden border border-black/[0.06] hover:scale-105 transition shrink-0" title="Переключить акцент озвучки (en-US / en-GB)">
              <span id="brand-flag-icon" class="w-7 h-5 flex items-center justify-center"></span>
            </button>
            <div>
              <h1 class="text-lg sm:text-xl font-extrabold tracking-tight leading-tight text-[#2D2E32]">English Every Day</h1>
              <p class="text-xs text-[#6E717A] font-medium">15 минут в день · персональный тренажёр</p>
            </div>
          </div>

          <div class="flex items-center gap-1.5 flex-nowrap overflow-x-auto no-scrollbar max-w-full">
            <!-- General Button -->
            <button type="button" id="general-lessons-btn" class="pill px-2.5 py-1.5 bg-[#FDECE0] hover:brightness-95 text-xs font-bold text-[#C25E24] flex items-center gap-1 shrink-0 transition" title="Общие темы для всех пользователей">
              <span>🌐</span>
              <span>General</span>
            </button>

            <!-- Accent Switcher -->
            <button id="accent-toggle-btn" class="pill px-2.5 py-1.5 bg-[#F3F1EC] hover:bg-[#EAE7DF] text-xs font-bold text-[#2D2E32] flex items-center gap-1 shrink-0 transition" title="Акцент озвучки (Web Speech API)">
              <span>🔊</span>
              <span id="accent-label">en-US</span>
            </button>

            <!-- Firebase Sync Indicator -->
            <button id="sync-status-btn" class="pill px-2.5 py-1.5 bg-white shadow-sm text-xs font-semibold text-[#2D2E32] flex items-center gap-1.5 shrink-0 hover:bg-[#F7F6F2] transition" title="Настройки синхронизации Firebase и Gemini API">
              <span id="sync-dot" class="w-2 h-2 rounded-full bg-[#A8DFC0]"></span>
              <span id="sync-label">Локально</span>
            </button>

            <!-- Account Button -->
            <button id="account-btn" class="pill px-3 py-1.5 bg-[#2D2E32] text-white text-xs font-bold flex items-center gap-1 shrink-0 hover:bg-[#1E1F22] transition">
              <span id="account-label">Войти</span>
            </button>
          </div>
        </div>

        <!-- Horizontal Pill Tabs -->
        <nav id="main-tabs" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pt-3 pb-1" aria-label="Разделы приложения">
        </nav>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 max-w-6xl w-full mx-auto px-4 py-5 pb-16">
    </main>
  </div>

  <!-- Modal Root -->
  <div id="modal-root"></div>

  <!-- Toast Container -->
  <div id="toast-root" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script>
    (function () {
      'use strict';

      // =========================================================================
      // CONSTANTS & PALETTE
      // =========================================================================
      const STORAGE_KEY = 'english_every_day_state_v3';
      const CONFIG_KEY = 'english_every_day_config_v2';
      const GENERAL_STORAGE_KEY = 'english_every_day_general_v1';
      const BUILTIN_FIREBASE_CONFIG = {
        apiKey: "AIzaSyBdW8A6YjjS79KIehW8upgqsG0RfJh3iPo",
        authDomain: "englisheveryday-cded8.firebaseapp.com",
        projectId: "englisheveryday-cded8",
        storageBucket: "englisheveryday-cded8.firebasestorage.app",
        messagingSenderId: "633814979660",
        appId: "1:633814979660:web:1b28c39fb331e65ebe10e9",
        measurementId: "G-95BZ996YB2"
      };

      const WORD_GROUPS = ['Phrasal verbs', 'Verbs', 'Nouns', 'Adjectives', 'Adverbs', 'Prepositions'];

      const TABS = [
        { id: 'today', label: 'Today', bg: '#EAE8E1', dot: '#2D2E32' },
        { id: 'lessons', label: 'Lessons', bg: '#FDECE0', dot: '#C25E24' },
        { id: 'words', label: 'Words', bg: '#EFEAFD', dot: '#5B3FD9' },
        { id: 'phrases', label: 'Collocations & Phrases', bg: '#E5F6EE', dot: '#1E7F53' },
        { id: 'tenses', label: 'Grammar', bg: '#E6F1FC', dot: '#236AB9' },
        { id: 'cheatsheet', label: 'Cheatsheet', bg: '#FEF6DF', dot: '#A56F08' },
        { id: 'tests', label: 'Tests', bg: '#EFEAFD', dot: '#5B3FD9' },
        { id: 'mistakes', label: 'Mistakes', bg: '#FDECEB', dot: '#C84444' },
        { id: 'report', label: 'Report', bg: '#E5F6EE', dot: '#1A5736' }
      ];

      // =========================================================================
      // DATE & UTILITY HELPERS
      // =========================================================================
      function getDateKey(dateObj) {
        const d = dateObj || new Date();
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      }

      function getOffsetDateKey(daysOffset) {
        const d = new Date();
        d.setDate(d.getDate() + daysOffset);
        return getDateKey(d);
      }

      function formatRuDate(dateStr) {
        if (!dateStr) return '—';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        return `${parts[2]}.${parts[1]}.${parts[0]}`;
      }

      function daysBetween(dateStrA, dateStrB) {
        if (!dateStrA || !dateStrB) return 999;
        const a = new Date(dateStrA + 'T00:00:00');
        const b = new Date(dateStrB + 'T00:00:00');
        return Math.floor((b - a) / (1000 * 60 * 60 * 24));
      }

      function uid(prefix) {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = a[i];
          a[i] = a[j];
          a[j] = tmp;
        }
        return a;
      }

      function renderMarkdownLite(text) {
        const lines = String(text || '').split('\n');
        let html = '';
        let inList = false;
        for (const rawLine of lines) {
          const line = rawLine.trim();
          if (!line) {
            if (inList) { html += '</ul>'; inList = false; }
            continue;
          }
          const formatted = escapeHtml(line)
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.+?)\*/g, '<em>$1</em>');
          if (line.startsWith('## ')) {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<h2>${formatted.slice(3)}</h2>`;
          } else if (line.startsWith('- ') || line.startsWith('• ')) {
            if (!inList) { html += '<ul>'; inList = true; }
            html += `<li>${formatted.slice(2)}</li>`;
          } else {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<p>${formatted}</p>`;
          }
        }
        if (inList) html += '</ul>';
        return html;
      }

      function showToast(message, type) {
        const root = document.getElementById('toast-root');
        if (!root) return;
        const el = document.createElement('div');
        const bg = type === 'error' ? '#FDECEB' : type === 'success' ? '#E5F6EE' : '#2D2E32';
        const fg = type === 'error' ? '#C84444' : type === 'success' ? '#1A5736' : '#FFFFFF';
        el.style.background = bg;
        el.style.color = fg;
        el.className = 'pill px-4 py-2.5 text-sm font-bold shadow-lg animate-fade pointer-events-auto';
        el.textContent = message;
        root.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transition = 'opacity 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 2600);
      }

      function speakText(text) {
        if (!text) return;
        try {
          if (!('speechSynthesis' in window)) {
            showToast('Озвучка не поддерживается этим браузером', 'error');
            return;
          }
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(text);
          utter.lang = state.settings.accent || 'en-US';
          utter.rate = 0.95;
          const voices = window.speechSynthesis.getVoices();
          const match = voices.find(v => v.lang === utter.lang) || voices.find(v => v.lang.startsWith('en'));
          if (match) utter.voice = match;
          window.speechSynthesis.speak(utter);
        } catch (e) {
          showToast('Не удалось воспроизвести озвучку', 'error');
        }
      }

      function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
        }
        fallbackCopy(text);
        return Promise.resolve();
      }

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        document.body.removeChild(ta);
      }

      // =========================================================================
      // INITIAL SEED DATA
      // =========================================================================
      function createInitialState() {
        return {
          user: {
            signedIn: false,
            uid: '',
            name: 'Гость',
            email: '',
            provider: 'local'
          },
          settings: {
            accent: 'en-US',
            dailyGoal: 15
          },
          lessons: [],
          words: [],
          phrases: [],
          tenses: [],
          cheatsheets: [],
          mistakes: [],
          testsHistory: [],
          stats: {
            totalAnswers: 0,
            correctAnswers: 0,
            activityByDate: {}
          }
        };
      }

      // =========================================================================
      // STATE & PERSISTENCE
      // =========================================================================
      let state = loadState();
      let config = loadConfig();

      // Transient UI state (not persisted)
      const ui = {
        activeTab: 'today',
        selectedLessonId: null,
        wordsFilter: { group: 'Все', status: 'Все', lesson: 'all', search: '' },
        phrasesFilter: { status: 'Все', lesson: 'all', search: '' },
        tensesFilter: { lesson: 'all' },
        cheatsheetFilter: { lesson: 'all', tag: 'Все', search: '' },
        // Timer for Today 15-min session
        timerSeconds: 15 * 60,
        timerRunning: false,
        timerInterval: null,
        // Active practice session
        session: null, // { mode, sourceTab, items, index, flipped, answered, lastCorrect, score, results, direction }
        // Test setup
        testScope: 'all',
        testLength: 15,
        // Firebase sync runtime status
        syncState: 'local', // 'local' | 'syncing' | 'synced' | 'error'
        fbAuth: null,
        fbDb: null,
        // Parsed lesson upload preview
        importPreview: null,
        // General Lessons (shared across users via Firestore)
        generalLessons: [],
        selectedGeneralLessonId: null,
        generalLoading: false,
        generalPermError: false
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.words) && Array.isArray(parsed.lessons)) {
              return parsed;
            }
          }
        } catch (_) {}
        return createInitialState();
      }

      function loadConfig() {
        try {
          const raw = localStorage.getItem(CONFIG_KEY);
          if (raw) return JSON.parse(raw);
        } catch (_) {}
        return { firebaseConfigText: '', geminiApiKey: '' };
      }

      function saveConfig() {
        try {
          localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
        } catch (_) {}
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (_) {}
        syncToFirebaseIfConnected();
      }

      // =========================================================================
      // FIREBASE AUTH & CLOUD FIRESTORE SYNC
      // =========================================================================
      function parseFirebaseConfigInput(rawText) {
        // Normalize iOS/macOS smart quotes, guillemets, and non-breaking spaces
        const text = String(rawText || '')
          .replace(/[\u201C\u201D\u201E\u00AB\u00BB]/g, '"')
          .replace(/[\u2018\u2019]/g, "'")
          .replace(/[\u00A0\u200B\uFEFF]/g, ' ')
          .trim();
        if (!text) return null;
        try {
          return JSON.parse(text);
        } catch (_) {}
        // Find the object literal that contains apiKey (safe even if import { ... } was pasted above)
        const blocks = text.match(/\{[^{}]*apiKey[^{}]*\}/) || text.match(/\{[\s\S]*\}/);
        if (!blocks) return null;
        const jsonLike = blocks[0]
          .replace(/\/\/.*$/gm, '')
          .replace(/([{,]\s*)([a-zA-Z0-9_]+)\s*:/g, '$1"$2":')
          .replace(/'/g, '"')
          .replace(/,\s*}/g, '}');
        try {
          return JSON.parse(jsonLike);
        } catch (_) {
          // Last-resort key/value regex extractor so stray punctuation never blocks connection
          const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId', 'measurementId'];
          const extracted = {};
          for (const k of keys) {
            const m = text.match(new RegExp(k + '["\x27\s]*:[\s\n]*["\x27]([^"\x27]+)["\x27]'));
            if (m && m[1]) extracted[k] = m[1].trim();
          }
          return (extracted.apiKey && extracted.projectId) ? extracted : null;
        }
      }

      function updateSyncBadge() {
        const dot = document.getElementById('sync-dot');
        const lbl = document.getElementById('sync-label');
        const acc = document.getElementById('account-label');
        if (!dot || !lbl || !acc) return;

        if (ui.syncState === 'synced') {
          dot.style.background = '#A8DFC0';
          lbl.textContent = 'Firebase ✓';
        } else if (ui.syncState === 'syncing') {
          dot.style.background = '#F6C760';
          lbl.textContent = 'Синхронизация...';
        } else if (ui.syncState === 'ready') {
          dot.style.background = '#93C5FD';
          lbl.textContent = 'Firebase готов';
        } else if (ui.syncState === 'error') {
          dot.style.background = '#E06D6D';
          lbl.textContent = 'Ошибка Firebase';
        } else {
          dot.style.background = '#D1D5DB';
          lbl.textContent = 'Локально';
        }

        acc.textContent = state.user.signedIn ? (state.user.name || state.user.email || 'Аккаунт') : 'Войти';
      }

      let syncTimer = null;
      async function syncToFirebaseIfConnected() {
        if (!ui.fbDb || !ui.fbAuth || !ui.fbAuth.currentUser) return;
        clearTimeout(syncTimer);
        syncTimer = setTimeout(async () => {
          try {
            const currentUser = ui.fbAuth.currentUser;
            if (!currentUser) return;
            ui.syncState = 'syncing';
            updateSyncBadge();
            const docPayload = {
              stateJson: JSON.stringify(state),
              updatedAt: new Date().toISOString()
            };
            if ((config.geminiApiKey || '').trim()) {
              docPayload.geminiApiKey = config.geminiApiKey.trim();
            }
            await ui.fbDb.collection('users').doc(currentUser.uid).set(docPayload, { merge: true });
            ui.syncState = 'synced';
            updateSyncBadge();
          } catch (err) {
            ui.syncState = 'error';
            updateSyncBadge();
          }
        }, 350);
      }

      async function loadStateFromFirestore(user) {
        if (!ui.fbDb || !user) return;
        try {
          ui.syncState = 'syncing';
          updateSyncBadge();
          const docRef = ui.fbDb.collection('users').doc(user.uid);
          const snap = await docRef.get();
          if (snap.exists && snap.data()) {
            const data = snap.data();
            if (data.stateJson) {
              const remote = JSON.parse(data.stateJson);
              if (remote && Array.isArray(remote.words)) {
                state = Object.assign(createInitialState(), remote);
              }
            }
            if (data.geminiApiKey && typeof data.geminiApiKey === 'string') {
              config.geminiApiKey = data.geminiApiKey;
              saveConfig();
            } else if ((config.geminiApiKey || '').trim()) {
              await docRef.set({ geminiApiKey: config.geminiApiKey.trim() }, { merge: true });
            }
          } else {
            const initDoc = {
              stateJson: JSON.stringify(state),
              updatedAt: new Date().toISOString()
            };
            if ((config.geminiApiKey || '').trim()) initDoc.geminiApiKey = config.geminiApiKey.trim();
            await docRef.set(initDoc);
          }
          state.user = {
            signedIn: true,
            uid: user.uid,
            name: user.displayName || (user.email ? user.email.split('@')[0] : 'Пользователь'),
            email: user.email || '',
            provider: 'firebase'
          };
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
          ui.syncState = 'synced';
          renderMain();
          showToast('Данные синхронизированы с Firebase', 'success');
          fetchGeneralLessons();
        } catch (err) {
          ui.syncState = 'error';
          updateSyncBadge();
          showToast('Ошибка чтения Firestore: проверьте правила доступа', 'error');
        }
      }

      function initFirebaseFromConfig(silent) {
        const fbCfg = parseFirebaseConfigInput(config.firebaseConfigText) || BUILTIN_FIREBASE_CONFIG;
        if (!fbCfg || !fbCfg.apiKey || !fbCfg.projectId) {
          ui.fbAuth = null;
          ui.fbDb = null;
          ui.syncState = 'local';
          updateSyncBadge();
          return false;
        }
        if (typeof window.firebase === 'undefined') {
          ui.syncState = 'error';
          updateSyncBadge();
          if (!silent) showToast('Firebase SDK не загрузился (нет сети)', 'error');
          return false;
        }
        try {
          const appName = 'englishEveryDayApp';
          const existing = window.firebase.apps.find(a => a.name === appName);
          const fbApp = existing || window.firebase.initializeApp(fbCfg, appName);
          ui.fbAuth = fbApp.auth();
          ui.fbDb = fbApp.firestore();
          ui.syncState = 'ready';
          updateSyncBadge();

          if (!ui.fbAuthListenerBound) {
            ui.fbAuthListenerBound = true;
            ui.fbAuth.onAuthStateChanged(user => {
              if (user) {
                loadStateFromFirestore(user);
              } else {
                if (state.user.provider === 'firebase') {
                  state.user = { signedIn: false, uid: '', name: 'Гость', email: '', provider: 'local' };
                  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
                }
                ui.syncState = 'ready';
                renderMain();
              }
            });
          }
          if (!silent) showToast('Firebase подключён! Теперь можно войти.', 'success');
          return true;
        } catch (err) {
          ui.syncState = 'error';
          updateSyncBadge();
          if (!silent) showToast('Неверный формат Firebase Config', 'error');
          return false;
        }
      }

      // =========================================================================
      // GENERAL LESSONS (SHARED FIRESTORE COLLECTION)
      // =========================================================================
      function loadLocalGeneralLessons() {
        try {
          const raw = localStorage.getItem(GENERAL_STORAGE_KEY);
          if (raw) {
            const arr = JSON.parse(raw);
            if (Array.isArray(arr)) ui.generalLessons = arr;
          }
        } catch (_) {}
      }

      function saveLocalGeneralLessons() {
        try {
          localStorage.setItem(GENERAL_STORAGE_KEY, JSON.stringify(ui.generalLessons));
        } catch (_) {}
      }

      async function fetchGeneralLessons() {
        if (!ui.fbDb || !ui.fbAuth || !ui.fbAuth.currentUser) {
          loadLocalGeneralLessons();
          ui.generalPermError = false;
          if (ui.activeTab === 'general') renderMain();
          return;
        }
        try {
          ui.generalLoading = true;
          ui.generalPermError = false;
          if (ui.activeTab === 'general') renderMain();
          const snap = await ui.fbDb.collection('general_lessons').orderBy('createdAt', 'desc').get();
          ui.generalLessons = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
          saveLocalGeneralLessons();
          ui.generalLoading = false;
          if (ui.activeTab === 'general') renderMain();
        } catch (err) {
          ui.generalLoading = false;
          if (err && (err.code === 'permission-denied' || String(err.message || '').includes('permission'))) {
            ui.generalPermError = true;
          }
          loadLocalGeneralLessons();
          if (ui.activeTab === 'general') renderMain();
        }
      }

      async function saveGeneralLessonToCloud(lessonObj) {
        const idx = ui.generalLessons.findIndex(x => x.id === lessonObj.id);
        if (idx >= 0) ui.generalLessons[idx] = lessonObj;
        else ui.generalLessons.unshift(lessonObj);
        saveLocalGeneralLessons();

        if (ui.fbDb && ui.fbAuth && ui.fbAuth.currentUser) {
          try {
            await ui.fbDb.collection('general_lessons').doc(lessonObj.id).set(lessonObj);
            ui.generalPermError = false;
            return true;
          } catch (err) {
            if (err && (err.code === 'permission-denied' || String(err.message || '').includes('permission'))) {
              ui.generalPermError = true;
              showToast('Добавьте правило для general_lessons в Firestore Rules', 'error');
            }
            return false;
          }
        }
        return true;
      }

      async function deleteGeneralLessonFromCloud(lessonId) {
        ui.generalLessons = ui.generalLessons.filter(x => x.id !== lessonId);
        saveLocalGeneralLessons();
        if (ui.fbDb && ui.fbAuth && ui.fbAuth.currentUser) {
          try {
            await ui.fbDb.collection('general_lessons').doc(lessonId).delete();
          } catch (_) {}
        }
      }

      // =========================================================================
      // STATS, STREAKS & MISTAKES LOGIC
      // =========================================================================
      function recordAnswer(isCorrect, mistakePayload) {
        const today = getDateKey();
        state.stats.totalAnswers = (state.stats.totalAnswers || 0) + 1;
        if (isCorrect) state.stats.correctAnswers = (state.stats.correctAnswers || 0) + 1;

        if (!state.stats.activityByDate) state.stats.activityByDate = {};
        if (!state.stats.activityByDate[today]) {
          state.stats.activityByDate[today] = { tasks: 0, completed: false };
        }
        state.stats.activityByDate[today].tasks += 1;
        if (state.stats.activityByDate[today].tasks >= (state.settings.dailyGoal || 15)) {
          state.stats.activityByDate[today].completed = true;
        }

        if (!isCorrect && mistakePayload) {
          addOrResetMistake(mistakePayload);
        }
        saveState();
      }

      function markTodayCompleted() {
        const today = getDateKey();
        if (!state.stats.activityByDate[today]) {
          state.stats.activityByDate[today] = { tasks: state.settings.dailyGoal || 15, completed: true };
        } else {
          state.stats.activityByDate[today].completed = true;
        }
        saveState();
      }

      function addOrResetMistake(payload) {
        const existing = state.mistakes.find(m =>
          m.section === payload.section &&
          m.itemId === payload.itemId &&
          (payload.exerciseId ? m.exerciseId === payload.exerciseId : true)
        );
        if (existing) {
          existing.streak = 0;
          existing.addedAt = getDateKey();
        } else {
          state.mistakes.push({
            id: uid('m'),
            section: payload.section,
            itemId: payload.itemId,
            exerciseId: payload.exerciseId || null,
            prompt: payload.prompt,
            expected: payload.expected,
            hint: payload.hint || '',
            streak: 0,
            addedAt: getDateKey()
          });
        }
      }

      function handleMistakePracticeResult(mistakeId, isCorrect) {
        const idx = state.mistakes.findIndex(m => m.id === mistakeId);
        if (idx === -1) return { removed: false };
        recordAnswer(isCorrect, null);
        if (isCorrect) {
          state.mistakes[idx].streak = (state.mistakes[idx].streak || 0) + 1;
          if (state.mistakes[idx].streak >= 2) {
            state.mistakes.splice(idx, 1);
            saveState();
            return { removed: true };
          }
        } else {
          state.mistakes[idx].streak = 0;
        }
        saveState();
        return { removed: false };
      }

      function computeStreakAndDays() {
        const map = state.stats.activityByDate || {};
        const completedDates = Object.keys(map).filter(k => map[k] && map[k].completed);
        const totalDays = completedDates.length;

        let streak = 0;
        const todayKey = getDateKey();
        const startOffset = (map[todayKey] && map[todayKey].completed) ? 0 : -1;
        for (let i = startOffset; i >= -365; i--) {
          const k = getOffsetDateKey(i);
          if (map[k] && map[k].completed) {
            streak += 1;
          } else {
            break;
          }
        }
        return { totalDays, streak };
      }

      function getLessonStats(lessonId) {
        const words = state.words.filter(w => (w.lessonIds || []).includes(lessonId));
        const phrases = state.phrases.filter(p => (p.lessonIds || []).includes(lessonId));
        const tenses = state.tenses.filter(t => (t.lessonIds || []).includes(lessonId));
        const sheets = state.cheatsheets.filter(c => (c.lessonIds || []).includes(lessonId));

        const totalTrackable = words.length + phrases.length + tenses.length;
        const knownTrackable =
          words.filter(w => w.status === 'Знаю').length +
          phrases.filter(p => p.status === 'Знаю').length +
          tenses.filter(t => t.status === 'Знаю').length;

        const percent = totalTrackable > 0 ? Math.round((knownTrackable / totalTrackable) * 100) : 0;
        return { words, phrases, tenses, sheets, totalTrackable, knownTrackable, percent };
      }

      function getLessonBadgesHtml(lessonIds) {
        const ids = lessonIds || [];
        if (!ids.length) {
          return `<span class="pill px-2.5 py-0.5 text-[11px] font-semibold bg-[#F3F1EC] text-[#6E717A]">Без урока</span>`;
        }
        return ids.map(id => {
          const l = state.lessons.find(x => x.id === id);
          if (!l) return '';
          const shortName = l.title.length > 26 ? l.title.slice(0, 25) + '…' : l.title;
          return `<button type="button" onclick="App.openLessonDetail('${escapeHtml(id)}')" class="pill px-2.5 py-0.5 text-[11px] font-bold bg-[#FDECE0] text-[#C25E24] hover:brightness-95 transition">${escapeHtml(shortName)}</button>`;
        }).join(' ');
      }

      function getStatusBadgeHtml(status) {
        if (status === 'Знаю') {
          return `<span class="pill px-2.5 py-0.5 text-[11px] font-bold bg-[#A8DFC0] text-[#1A5736]">Знаю</span>`;
        }
        if (status === 'Изучаю') {
          return `<span class="pill px-2.5 py-0.5 text-[11px] font-bold bg-[#EFEAFD] text-[#5B3FD9]">Изучаю</span>`;
        }
        return `<span class="pill px-2.5 py-0.5 text-[11px] font-bold bg-[#F3F1EC] text-[#6E717A]">Новое</span>`;
      }

      // =========================================================================
      // VIEW 1: TODAY
      // =========================================================================
      function buildTodayPlan() {
        const learningWords = state.words.filter(w => w.status === 'Изучаю');
        const newWords = state.words.filter(w => w.status === 'Новое');
        const todayWords = learningWords.concat(newWords).slice(0, 10);

        const learningPhrases = state.phrases.filter(p => p.status !== 'Знаю');
        const todayPhrases = (learningPhrases.length ? learningPhrases : state.phrases).slice(0, 5);

        const tenseExercises = [];
        const priorityTenses = state.tenses.slice().sort((a, b) => (a.status === 'Изучаю' ? -1 : 1));
        for (const t of priorityTenses) {
          for (const ex of (t.exercises || [])) {
            tenseExercises.push({ tense: t, exercise: ex });
          }
        }
        const todayTenses = tenseExercises.slice(0, 5);
        const todayMistakes = state.mistakes.slice(0, 5);

        return { todayWords, todayPhrases, todayTenses, todayMistakes };
      }

      // =========================================================================

      function buildTeacherReportText() {
        const { totalDays, streak } = computeStreakAndDays();
        const wordsKnown = state.words.filter(w => w.status === 'Знаю').length;
        const wordsLearning = state.words.filter(w => w.status === 'Изучаю').length;
        const phrasesKnown = state.phrases.filter(p => p.status === 'Знаю').length;
        const tensesKnown = state.tenses.filter(t => t.status === 'Знаю').length;
        const accuracy = state.stats.totalAnswers > 0 ? Math.round((state.stats.correctAnswers / state.stats.totalAnswers) * 100) : 0;
        const lastTest = state.testsHistory && state.testsHistory[0];

        const lessonLines = state.lessons.map(l => {
          const st = getLessonStats(l.id);
          return `• ${l.title}: ${st.percent}% (${st.knownTrackable}/${st.totalTrackable})`;
        }).join('\n');

        return [
          `📊 Отчёт English Every Day (${formatRuDate(getDateKey())})`,
          `🔥 Серия подряд: ${streak} дн. (всего дней занятий: ${totalDays})`,
          `📚 Слова: Знаю ${wordsKnown} / ${state.words.length} (в работе: ${wordsLearning})`,
          `💬 Фразы и коллокации: Знаю ${phrasesKnown} / ${state.phrases.length}`,
          `⏱ Грамматика: Освоено ${tensesKnown} / ${state.tenses.length}`,
          `🎯 Общая точность ответов: ${accuracy}%`,
          `📝 Последний тест: ${lastTest ? `${lastTest.percent}% (${lastTest.score}/${lastTest.total}, ${formatRuDate(lastTest.date)}, ${lastTest.scopeLabel})` : 'ещё не пройден'}`,
          `📌 В работе над ошибками: ${state.mistakes.length}`,
          state.lessons.length ? `\n📖 Прогресс по урокам:\n${lessonLines}` : ''
        ].filter(Boolean).join('\n');
      }

      function renderReportView() {
        const { totalDays, streak } = computeStreakAndDays();
        const wordsKnown = state.words.filter(w => w.status === 'Знаю').length;
        const wordsLearning = state.words.filter(w => w.status === 'Изучаю').length;
        const phrasesKnown = state.phrases.filter(p => p.status === 'Знаю').length;

        const accuracy = state.stats.totalAnswers > 0 ? Math.round((state.stats.correctAnswers / state.stats.totalAnswers) * 100) : 0;
        const lastTest = state.testsHistory && state.testsHistory[0];

        // 14 days activity tracker
        const trackerDays = [];
        for (let i = -13; i <= 0; i++) {
          const dk = getOffsetDateKey(i);
          const rec = (state.stats.activityByDate && state.stats.activityByDate[dk]) || { tasks: 0, completed: false };
          const dNum = dk.slice(8, 10);
          trackerDays.push({ dk, dNum, tasks: rec.tasks || 0, completed: !!rec.completed, isToday: i === 0 });
        }

        const reportText = buildTeacherReportText();

        return `
          <div class="space-y-5 animate-fade">
            <!-- Metrics Grid -->
            <div class="grid grid-cols-2 lg:grid-cols-3 gap-4">
              <div class="card p-5 bg-[#E5F6EE]/70">
                <div class="text-xs font-bold text-[#1E7F53]">Занятия и серия</div>
                <div class="text-2xl sm:text-3xl font-extrabold mt-1">${streak} дн. подряд</div>

      // =========================================================================
      // INTERACTIVE PRACTICE & TEST ENGINE (Unified Session View)
      // =========================================================================
      function renderSessionView() {
        const s = ui.session;
        if (!s) return '';

        // Session Finished Summary
        if (s.index >= s.items.length) {
          const total = s.items.length || 1;
          const pct = Math.round((s.score / total) * 100);
          return `
            <div class="card p-6 sm:p-8 max-w-xl mx-auto text-center space-y-5 animate-fade">
              <div class="w-16 h-16 rounded-3xl mx-auto flex items-center justify-center text-3xl" style="background:${pct >= 80 ? '#A8DFC0' : '#FEF6DF'};">
                ${pct >= 80 ? '🎉' : '💪'}
              </div>
              <div>
                <h2 class="text-2xl font-extrabold">${escapeHtml(s.title)} — завершено!</h2>
                <p class="text-sm text-[#6E717A] mt-1">Верных ответов: <strong>${s.score} из ${total}</strong> (${pct}%)</p>
              </div>

              ${s.mistakesList && s.mistakesList.length > 0 ? `
                <div class="text-left bg-[#FDECEB]/70 rounded-2xl p-4 space-y-2">
                  <div class="text-xs font-extrabold text-[#C84444]">Ошибки (автоматически добавлены в Mistakes):</div>
                  ${s.mistakesList.map(m => `
                    <div class="text-xs">
                      <strong>${escapeHtml(m.prompt)}</strong> → <span class="text-[#1E7F53] font-bold">${escapeHtml(m.expected)}</span>
                    </div>
                  `).join('')}
                </div>
              ` : `
                <div class="bg-[#E5F6EE] rounded-2xl p-3 text-xs font-bold text-[#1A5736]">Без единой ошибки!</div>
              `}

              <button type="button" onclick="App.exitSession()" class="btn-primary !px-7 !py-3">Вернуться в раздел</button>
            </div>
          `;
        }

        const item = s.items[s.index];
        const pct = Math.round((s.index / s.items.length) * 100);

        return `
          <div class="max-w-2xl mx-auto space-y-4 animate-fade">
            <div class="flex items-center justify-between gap-3">
              <button type="button" onclick="App.exitSession()" class="btn-soft text-xs">← Завершить</button>
              <div class="text-xs font-extrabold text-[#6E717A]">${escapeHtml(s.title)} · ${s.index + 1} / ${s.items.length}</div>
            </div>

            <div class="w-full h-2 bg-[#ECE9E1] rounded-full overflow-hidden">
              <div class="h-full bg-[#5B3FD9] rounded-full transition-all" style="width:${pct}%"></div>
            </div>

            ${renderSessionCard(item, s)}
          </div>
        `;
      }

      function renderSessionCard(item, s) {
        // 1. FLASHCARD
        if (item.kind === 'flashcard') {
          return `
            <div class="flip-scene">
              <div class="flip-card ${s.flipped ? 'is-flipped' : ''}" onclick="App.flipCard()">
                <div class="flip-face bg-white">
                  <span class="pill px-3 py-1 text-xs font-bold bg-[#EFEAFD] text-[#5B3FD9] mb-4">${escapeHtml(item.badge || 'Карточка')}</span>
                  <div class="text-2xl sm:text-3xl font-extrabold">${escapeHtml(item.front)}</div>
                  <button type="button" onclick="event.stopPropagation(); App.speak('${escapeHtml(item.speak || item.front)}')" class="btn-soft mt-4 text-xs">🔊 Озвучить</button>
                  <div class="text-xs text-[#6E717A] mt-6">Нажмите на карточку, чтобы перевернуть</div>
                </div>
                <div class="flip-face flip-back bg-[#FAF9F6]">
                  <span class="pill px-3 py-1 text-xs font-bold bg-[#E5F6EE] text-[#1E7F53] mb-3">Перевод</span>
                  <div class="text-2xl font-extrabold text-[#2D2E32]">${escapeHtml(item.back)}</div>
                  ${item.example ? `<p class="text-sm text-[#6E717A] italic mt-3 max-w-md">“${escapeHtml(item.example)}”</p>` : ''}
                </div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3 pt-2">
              <button type="button" onclick="App.answerFlashcard(false)" class="btn-soft !bg-[#FDECEB] !text-[#C84444] !py-3.5 text-sm font-extrabold">↺ Повторить</button>
              <button type="button" onclick="App.answerFlashcard(true)" class="btn-soft !bg-[#A8DFC0] !text-[#1A5736] !py-3.5 text-sm font-extrabold">✓ Знаю</button>
            </div>
          `;
        }

        // 2. MULTIPLE CHOICE QUIZ
        if (item.kind === 'choice') {
          return `
            <div class="card p-6 sm:p-7 space-y-5">
              <div class="flex items-center justify-between gap-2">
                <span class="pill px-3 py-1 text-xs font-bold bg-[#EFEAFD] text-[#5B3FD9]">${escapeHtml(item.badge || 'Квиз')}</span>
                ${item.speak ? `<button type="button" onclick="App.speak('${escapeHtml(item.speak)}')" class="btn-soft !py-1.5 !px-3 text-xs">🔊</button>` : ''}
              </div>
              <div class="text-xl sm:text-2xl font-extrabold leading-snug">${escapeHtml(item.prompt)}</div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                ${item.options.map((opt, idx) => {
                  let cls = 'bg-[#FAF9F6] hover:bg-[#F1EFE8] text-[#2D2E32]';
                  if (s.answered) {
                    if (opt === item.answer) cls = 'bg-[#A8DFC0] text-[#1A5736]';
                    else if (opt === s.selectedOption) cls = 'bg-[#FDECEB] text-[#C84444]';
                  }
                  return `

          hint: `Полная фраза: ${p.phrase}`

      // LESSON FILE PARSING (.txt, .md, .docx, .pdf, Images + Gemini API + Offline Fallback)
      // =========================================================================
      async function extractTextFromDocx(arrayBuffer) {
        // Lightweight ZIP reader using native DecompressionStream('deflate-raw')
        const bytes = new Uint8Array(arrayBuffer);
        const view = new DataView(arrayBuffer);
        let offset = 0;
        while (offset + 30 < bytes.length) {
          if (view.getUint32(offset, true) !== 0x04034b50) break;
          const compression = view.getUint16(offset + 8, true);
          const compSize = view.getUint32(offset + 18, true);
          const nameLen = view.getUint16(offset + 26, true);
          const extraLen = view.getUint16(offset + 28, true);
          const name = new TextDecoder().decode(bytes.subarray(offset + 30, offset + 30 + nameLen));
          const dataStart = offset + 30 + nameLen + extraLen;
          const dataEnd = dataStart + compSize;
          if (name === 'word/document.xml') {
            const chunk = bytes.subarray(dataStart, dataEnd);
            let xmlText = '';
            if (compression === 0) {
              xmlText = new TextDecoder().decode(chunk);
            } else if (compression === 8 && typeof DecompressionStream !== 'undefined') {
              const ds = new DecompressionStream('deflate-raw');
              const writer = ds.writable.getWriter();
              writer.write(chunk);
              writer.close();
              const buf = await new Response(ds.readable).arrayBuffer();
              xmlText = new TextDecoder().decode(buf);
            }
            const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
            const paras = Array.from(doc.getElementsByTagName('w:p'));
            return paras.map(p => {
              const runs = Array.from(p.getElementsByTagName('w:r'));
              return runs.map(r => {
                const txt = Array.from(r.getElementsByTagName('w:t')).map(t => t.textContent).join('');
                if (!txt) return '';
                const rPr = r.getElementsByTagName('w:rPr')[0];
                const bEl = rPr ? rPr.getElementsByTagName('w:b')[0] : null;
                const isBold = bEl && bEl.getAttribute('w:val') !== '0' && bEl.getAttribute('w:val') !== 'false';
                return isBold && txt.trim() ? `**${txt.trim()}**` + (txt.endsWith(' ') ? ' ' : '') : txt;
              }).join('');
            }).filter(l => l.trim()).join('\n');
          }
          offset = dataEnd;
        }
        return '';
      }

      async function extractTextFromPdf(arrayBuffer) {
        try {
          if (window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const pages = [];
            for (let i = 1; i <= Math.min(pdf.numPages, 15); i++) {
              const page = await pdf.getPage(i);
              const tc = await page.getTextContent();
              pages.push(tc.items.map(it => it.str).join(' '));
            }
            return pages.join('\n');
          }
        } catch (_) {}
        // Fallback: extract printable ASCII/UTF-8 strings
        const raw = new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(arrayBuffer));
        const matches = raw.match(/\(([^()]{3,120})\)/g) || [];
        return matches.map(m => m.slice(1, -1)).join('\n');
      }

      async function callGeminiJson(parts) {
        const apiKey = (config.geminiApiKey || '').trim();
        if (!apiKey) return { ok: false, error: 'Не указан Gemini API Key' };

        let candidateModels = ['gemini-flash-latest', 'gemini-3.0-flash', 'gemini-2.5-flash'];
        try {
          const listResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(apiKey)}`);
          if (listResp.ok) {
            const listData = await listResp.json();
            const usable = (listData.models || [])
              .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
              .map(m => String(m.name || '').replace(/^models\//, ''))
              .filter(n => /gemini/i.test(n) && /flash/i.test(n) && !/tts|image|audio|robotics|computer/i.test(n));
            if (usable.length > 0) {
              usable.sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
              candidateModels = Array.from(new Set(usable.concat(candidateModels)));
            }
          }
        } catch (_) {}

        let lastErrMsg = '';
        for (const modelName of candidateModels.slice(0, 5)) {
          try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(modelName)}:generateContent?key=${encodeURIComponent(apiKey)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts }],
                generationConfig: { responseMimeType: 'application/json', temperature: 0.2 }
              })
            });
            if (resp.ok) {
              const json = await resp.json();
              const rawText = json.candidates?.[0]?.content?.parts?.[0]?.text || '';
              const cleaned = rawText.replace(/^```json\s*/i, '').replace(/```$/i, '').trim();
              return { ok: true, data: JSON.parse(cleaned), model: modelName };
            } else {
              const errData = await resp.json().catch(() => ({}));
              lastErrMsg = errData.error?.message || `ошибка ${resp.status}`;
            }
          } catch (e) {
            lastErrMsg = e.message || 'Ошибка сети';
          }
        }
        return { ok: false, error: lastErrMsg || 'Не удалось связаться с Gemini API' };
      }

      function normalizeExercises(arr, fallbackHint) {
        return (Array.isArray(arr) ? arr : [])
          .filter(ex => ex && ex.prompt && ex.answer)

            const opts = Array.isArray(ex.options) && ex.options.length >= 2
              ? Array.from(new Set([ans].concat(ex.options.map(o => String(o).trim()).filter(Boolean)))).slice(0, 4)
              : null;
            return {
              id: uid('te'),
              prompt: String(ex.prompt).trim(),
              answer: ans,
              accept: [ans.toLowerCase()],
              options: opts,
              hint: String(ex.hint || fallbackHint || '').trim()
            };
          });
      }

      function offlineParseLessonText(text, fileName) {
        const lines = String(text || '').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
        const words = [];
        const phrases = [];
        const grammar = [];
        const cheatsheets = [];
        const notesBuffer = [];
        const isPrepTopic = /preposition|предлог/i.test(fileName + ' ' + text.slice(0, 400));
        const seenWords = new Set();

        for (const line of lines) {
          const clean = line.replace(/\*\*/g, '').replace(/^[-•*\d.)]+\s*/, '');
          // Detect explicit tense/grammar headings
          if (/^(Present|Past|Future)\s+(Simple|Continuous|Perfect|Perfect Continuous)/i.test(clean) && clean.length < 60) {
            grammar.push({
              checked: true,
              name: clean,
              formulaPos: '',
              formulaNeg: '',
              formulaQ: '',
              usage: 'Из конспекта урока',
              markers: '',
              examples: '',
              exercises: []
            });
            continue;
          }

          const boldMatches = Array.from(line.matchAll(/\*\*([^*]{1,45})\*\*/g)).map(m => m[1].trim()).filter(Boolean);
          const parts = clean.split(/\s*[—–\-|:]\s*/).filter(Boolean);

          if (parts.length >= 2 && /[a-zA-Z]/.test(parts[0]) && parts[0].length < 55) {
            const en = parts[0].trim();
            const ru = parts[1].trim();
            const ex = parts[2] ? parts[2].trim() : '';
            const wordCount = en.split(/\s+/).length;
            if (wordCount >= 3) {
              phrases.push({ checked: true, phrase: en, translation: ru, example: ex });
            } else if (!seenWords.has(en.toLowerCase())) {
              seenWords.add(en.toLowerCase());
              const group = isPrepTopic ? 'Prepositions'
                : wordCount === 2 && /\b(up|out|off|in|on|over|down|away|back|for|to)\b/i.test(en) ? 'Phrasal verbs'
                : en.endsWith('ly') ? 'Adverbs'
                : 'Verbs';
              words.push({ checked: true, word: en, translation: ru, group, example: ex });
            }
            if (isPrepTopic) notesBuffer.push(line);
          } else {
            boldMatches.forEach(term => {
              if (/[a-zA-Z]/.test(term) && !/[а-яА-ЯёЁ]/.test(term) && !seenWords.has(term.toLowerCase()) && term.length > 1) {
                seenWords.add(term.toLowerCase());
                words.push({
                  checked: true,
                  word: term,
                  translation: '',
                  group: isPrepTopic ? 'Prepositions' : 'Nouns',
                  example: clean.length < 140 ? clean : ''
                });
              }
            });
            notesBuffer.push(line);
          }
        }

        if (notesBuffer.length > 0) {
          cheatsheets.push({
            checked: true,
            title: `Шпаргалка: ${fileName.replace(/\.[^.]+$/, '')}`,
            category: isPrepTopic ? 'Prepositions' : 'Конспект урока',
            content: notesBuffer.slice(0, 40).join('\n')
          });
        }

        return { words, phrases, grammar, cheatsheets, source: 'offline' };
      }

      async function parseLessonWithGeminiOrFallback(payload) {

        if (apiKey) {

Разбери учебный конспект урока (текст, PDF, DOCX или фото) и верни СТРОГО валидный JSON со следующей структурой:

ЖЁСТКИЕ ПРАВИЛА РАЗДЕЛЕНИЯ ПО РАЗДЕЛАМ:
1. GRAMMAR — ОБЯЗАТЕЛЬНО выноси сюда все грамматические темы, времена (Present/Past/Future и т.д.), конструкции, модальные глаголы, условные предложения, пассивный залог. Для каждой темы ОБЯЗАТЕЛЬНО составь 3-5 тренировочных упражнений в поле "exercises" (с 4 вариантами в "options", один из которых равен "answer").
2. WORDS — добавляй ТОЛЬКО реально изучаемую новую лексику, предлоги (group: "Prepositions") или слова, выделенные жирным специально для заучивания. КАТЕГОРИЧЕСКИ НЕ добавляй в words базовые служебные слова и обрывки грамматических формул (вроде I, have, been, doing, is, are, Present Simple).
3. PHRASES — устойчивые выражения, коллокации и идиомы.
4. CHEATSHEETS — только короткие сводные шпаргалки, таблицы сравнения, исключения и пояснения случаев употребления (не дублируй целиком то, что уже оформлено в grammar).`;

          const parts = [{ text: promptText }];
          if (payload.imageBase64 && payload.imageMime) {
            parts.push({ inline_data: { mime_type: payload.imageMime, data: payload.imageBase64 } });
          } else {
            parts.push({ text: `Имя файла: ${payload.fileName}\n\nСодержимое конспекта:\n` + payload.text.slice(0, 18000) });
          }

          const res = await callGeminiJson(parts);
          if (res.ok && res.data) {
            const parsed = res.data;
            return {
              grammar: (parsed.grammar || []).map(g => ({
                checked: true,
                name: g.name || 'Грамматическая тема',
                formulaPos: g.formulaPos || '',
                formulaNeg: g.formulaNeg || '',
                formulaQ: g.formulaQ || '',
                usage: g.usage || '',
                markers: g.markers || '',
                examples: Array.isArray(g.examples) ? g.examples.join('\n') : (g.examples || ''),
                exercises: normalizeExercises(g.exercises, g.usage)
              })),
              words: (parsed.words || []).map(w => ({ checked: true, word: w.word || '', translation: w.translation || '', group: WORD_GROUPS.includes(w.group) ? w.group : 'Nouns', example: w.example || '' })),
              phrases: (parsed.phrases || []).map(p => ({ checked: true, phrase: p.phrase || '', translation: p.translation || '', example: p.example || '' })),
              cheatsheets: (parsed.cheatsheets || []).map(c => ({ checked: true, title: c.title || 'Шпаргалка', category: c.category || 'Грамматика', content: c.content || '' })),
              source: 'gemini'
            };
          } else {
            showToast('Gemini API: ' + res.error + ' — включён офлайн-разбор', 'error');
          }
        }

        if (payload.imageBase64 && !payload.text) {
          return {
            grammar: [],
            words: [{ checked: true, word: 'in', translation: 'в (внутри / месяцы)', group: 'Prepositions', example: '' }],
            phrases: [],
            cheatsheets: [{ checked: true, title: `Фото конспекта (${payload.fileName})`, category: 'Конспект', content: 'Добавьте Gemini API ключ в настройках аккаунта для автоматического распознавания фото конспектов.' }],
            source: 'offline-image'
          };
        }
        return offlineParseLessonText(payload.text, payload.fileName);
      }

            sourceTab: 'today',

            isTodayFull: true,

            answered: false,

            items = plan.todayPhrases.map(p => makePhraseBlankItem(p));

          } else if (block === 'tenses') {
            items = plan.todayTenses.map(x => makeTenseItem(x.tense, x.exercise, 'input'));

          } else if (block === 'mistakes') {
            items = plan.todayMistakes.map(m => makeMistakeItem(m));

        async handleLessonFileSelected(input) {
          const file = input.files && input.files[0];
          if (!file) return;
          const targetLessonId = document.getElementById('upload-target-lesson').value;
          const statusBox = document.getElementById('upload-status-box');
          if (statusBox) statusBox.textContent = `Читаем и разбираем файл «${file.name}»...`;

          const ext = file.name.split('.').pop().toLowerCase();
          const payload = { fileName: file.name, text: '', imageBase64: null, imageMime: null };

          try {
            if (file.type.startsWith('image/')) {
              const dataUrl = await new Promise((res, rej) => {
                const r = new FileReader();
                r.onload = () => res(r.result);
                r.onerror = rej;
                r.readAsDataURL(file);
              });
              payload.imageMime = file.type;
              payload.imageBase64 = String(dataUrl).split(',')[1];
            } else if (ext === 'docx') {
              const buf = await file.arrayBuffer();
              payload.text = await extractTextFromDocx(buf);
            } else if (ext === 'pdf') {
              const buf = await file.arrayBuffer();
              payload.text = await extractTextFromPdf(buf);
            } else {
              payload.text = await file.text();
            }

            const parsed = await parseLessonWithGeminiOrFallback(payload);
            ui.importPreview = {
              fileName: file.name,
              targetLessonId,
              source: parsed.source,
              grammar: parsed.grammar || [],
              words: parsed.words || [],
              phrases: parsed.phrases || [],
              cheatsheets: parsed.cheatsheets || []
            };
            this.renderImportPreviewModal();
          } catch (err) {
            if (statusBox) statusBox.textContent = 'Не удалось прочитать файл. Попробуйте другой формат.';
          }
        },

        confirmImportPreview() {
          const p = ui.importPreview;
          if (!p) return;
          let lessonId = p.targetLessonId;
          if (lessonId === 'new') {
            const newLesson = {
              id: uid('lesson'),
              title: p.fileName.replace(/\.[^.]+$/, ''),
              description: `Импортировано из файла ${p.fileName}`,
              createdAt: getDateKey()
            };
            state.lessons.push(newLesson);
            lessonId = newLesson.id;
          }

          let added = 0;
          (p.grammar || []).filter(g => g.checked && g.name.trim()).forEach(g => {
            state.tenses.unshift({
              id: uid('t'),
              name: g.name.trim(),
              formulaPos: g.formulaPos || '',
              formulaNeg: g.formulaNeg || '',
              formulaQ: g.formulaQ || '',
              usage: g.usage || '',
              markers: g.markers || '',
              examples: g.examples || '',
              status: 'Изучаю',
              correctCount: 0,
              totalCount: 0,
              exercises: g.exercises || [],
              lessonIds: [lessonId]
            });
            added++;
          });
          p.words.filter(w => w.checked && w.word.trim()).forEach(w => {
            state.words.unshift({ id: uid('w'), word: w.word.trim(), translation: w.translation.trim(), group: w.group || 'Nouns', example: w.example || '', status: 'Новое', lessonIds: [lessonId] });
            added++;

        async loadBulkFileIntoTextarea(input) {
          const f = input.files && input.files[0];

        runBulkImport(targetType) {
          const raw = (document.getElementById('bulk-text').value || '').trim();
          if (!raw) return;
          const lessonIds = Array.from(document.querySelectorAll('input[name="lessonIds"]:checked')).map(i => i.value);
          const defGroup = document.getElementById('bulk-group') ? document.getElementById('bulk-group').value : 'Nouns';
          let count = 0;

          if (raw.startsWith('[') || raw.startsWith('{')) {
            try {
              const parsed = JSON.parse(raw);
              const arr = Array.isArray(parsed) ? parsed : (parsed.words || parsed.phrases || []);
              arr.forEach(row => {
                if (targetType === 'words' && (row.word || row.en)) {
                  state.words.unshift({ id: uid('w'), word: row.word || row.en, translation: row.translation || row.ru || '', group: WORD_GROUPS.includes(row.group) ? row.group : defGroup, example: row.example || '', status: 'Новое', lessonIds });
                  count++;
                } else if (targetType === 'phrases' && (row.phrase || row.en)) {
                  state.phrases.unshift({ id: uid('p'), phrase: row.phrase || row.en, translation: row.translation || row.ru || '', example: row.example || '', status: 'Изучаю', lessonIds });
                  count++;
                }
              });
            } catch (_) {}
          } else {
            const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
            lines.forEach(line => {
              const parts = line.split(/\s*(?:—|–|\||;|\t| - )\s*/);
              if (parts.length < 2) {
                const csv = line.split(',').map(s => s.trim());
                if (csv.length >= 2) parts.splice(0, parts.length, ...csv);
              }
              if (parts.length >= 2) {
                if (targetType === 'words') {
                  state.words.unshift({ id: uid('w'), word: parts[0], translation: parts[1], group: defGroup, example: parts[2] || '', status: 'Новое', lessonIds });
                } else {
                  state.phrases.unshift({ id: uid('p'), phrase: parts[0], translation: parts[1], example: parts[2] || '', status: 'Изучаю', lessonIds });
                }
                count++;
              }
            });
          }

          saveState();
          closeModal();
          renderMain();
          showToast(`Импортировано записей: ${count}`, count > 0 ? 'success' : 'error');
        },

          const existingPrompts = (t.exercises || []).map(e => e.prompt).slice(-10).join('\n');
          const prompt = `Составь 5 новых разнообразных упражнений по теме английской грамматики "${t.name}".
Контекст темы:
Формулы: + ${t.formulaPos || '-'} | - ${t.formulaNeg || '-'} | ? ${t.formulaQ || '-'}
Употребление: ${t.usage || '-'}

${existingPrompts || 'нет'}

Верни СТРОГО JSON формата:

          const title = document.getElementById('f-cs-title').value.trim();
          const category = document.getElementById('f-cs-cat').value.trim() || 'Общее';
          const tags = document.getElementById('f-cs-tags').value.split(',').map(s => s.trim()).filter(Boolean);
          const content = document.getElementById('f-cs-content').value.trim();
          const lessonIds = Array.from(document.querySelectorAll('input[name="lessonIds"]:checked')).map(i => i.value);
          if (!title || !content) return;
          if (id) {
            const c = state.cheatsheets.find(x => x.id === id);
            if (c) Object.assign(c, { title, category, tags, content, lessonIds });
          } else {
            state.cheatsheets.unshift({ id: uid('cs'), title, category, tags, content, lessonIds });
          }
          saveState();
          closeModal();
          renderMain();
          showToast('Шпаргалка сохранена', 'success');

        deleteCheatsheet(id) {

        // --- Tests ---
        setTestConfig(key, val) {
          if (key === 'scope') ui.testScope = val;
          if (key === 'length') ui.testLength = Number(val) || 15;
        },

        launchTestForLesson(lessonId) {
          ui.testScope = lessonId;
          ui.activeTab = 'tests';
          this.startControlTest();
        },

        startControlTest() {
          const scope = ui.testScope;
          const lesson = scope !== 'all' ? state.lessons.find(l => l.id === scope) : null;
          const filterByScope = arr => scope === 'all' ? arr : arr.filter(x => (x.lessonIds || []).includes(scope));

          // Priority to "Изучаю" and "Новое"
          const sortPriority = arr => arr.slice().sort((a, b) => {
            const score = s => s === 'Изучаю' ? 0 : s === 'Новое' ? 1 : 2;
            return score(a.status) - score(b.status);
          });

          const words = sortPriority(filterByScope(state.words));
          const phrases = sortPriority(filterByScope(state.phrases));
          const tenses = sortPriority(filterByScope(state.tenses));

          const pool = [];
          words.forEach((w, i) => pool.push(makeWordQuizItem(w, i % 2 === 0 ? 'en-ru' : 'ru-en')));
          phrases.forEach(p => pool.push(makePhraseBlankItem(p)));
          tenses.forEach(t => (t.exercises || []).forEach(ex => pool.push(makeTenseItem(t, ex, 'choice'))));

          const items = pool.slice(0, ui.testLength);
          if (items.length === 0) {
            showToast('Недостаточно материалов для запуска теста', 'error');
            return;
          }
          ui.session = {
            sourceTab: 'tests',
            isControlTest: true,
            scopeLabel: lesson ? lesson.title : 'Все материалы',
            title: `Контрольный тест (${lesson ? lesson.title : 'Все материалы'})`,
            items: shuffle(items),
            index: 0,
            flipped: false,
            answered: false,
            score: 0,
            mistakesList: []
          };
          renderMain();
        },

        // --- Mistakes ---
        startMistakesPractice() {
          if (state.mistakes.length === 0) return;
          const items = state.mistakes.map(m => makeMistakeItem(m));
          ui.session = { sourceTab: 'mistakes', title: 'Проработка ошибок', items, index: 0, flipped: false, answered: false, score: 0, mistakesList: [] };
          renderMain();
        },

        removeMistakeManually(id) {
          state.mistakes = state.mistakes.filter(m => m.id !== id);
          saveState();
          renderMain();
        },

        // --- Session Interactions ---
        flipCard() {
          if (!ui.session) return;
          ui.session.flipped = !ui.session.flipped;
          renderMain();
        },

        answerFlashcard(known) {
          const s = ui.session;
          if (!s) return;
          const item = s.items[s.index];
          if (known) {
            s.score += 1;
            if (item.section === 'Words') {
              const w = state.words.find(x => x.id === item.itemId);
              if (w) w.status = 'Знаю';
            } else if (item.section === 'Phrases') {
              const p = state.phrases.find(x => x.id === item.itemId);
              if (p) p.status = 'Знаю';
            }
            recordAnswer(true, null);
          } else {
            if (item.section === 'Words') {
              const w = state.words.find(x => x.id === item.itemId);
              if (w) w.status = 'Изучаю';
            }
            const mPayload = { section: item.section, itemId: item.itemId, prompt: item.front, expected: item.back, hint: item.example };
            s.mistakesList.push(mPayload);
            recordAnswer(false, mPayload);
          }
          this.nextSessionItem();
        },

        submitChoiceAnswer(optIdx) {
          const s = ui.session;
          if (!s || s.answered) return;
          const item = s.items[s.index];
          const chosen = item.options[optIdx];
          const isCorrect = chosen === item.answer;
          s.answered = true;
          s.selectedOption = chosen;
          s.lastCorrect = isCorrect;
          this.processGradedAnswer(item, isCorrect);
          renderMain();
        },

        submitInputAnswer() {
          const s = ui.session;
          if (!s || s.answered) return;
          const item = s.items[s.index];
          const inp = document.getElementById('session-text-input');
          const val = (inp ? inp.value : '').trim();
          if (!val) return;
          const norm = val.toLowerCase().replace(/\s+/g, ' ');
          const accepted = (item.accept || [item.answer]).map(a => String(a).toLowerCase().replace(/\s+/g, ' '));
          const isCorrect = accepted.includes(norm);
          s.answered = true;
          s.inputValue = val;
          s.lastCorrect = isCorrect;
          this.processGradedAnswer(item, isCorrect);
          renderMain();
        },

        processGradedAnswer(item, isCorrect) {
          const s = ui.session;
          if (isCorrect) s.score += 1;

          // Update tense mastery counters
          if (item.section === 'Tenses') {
            const t = state.tenses.find(x => x.id === item.itemId);
            if (t) {
              t.totalCount = (t.totalCount || 0) + 1;
              if (isCorrect) t.correctCount = (t.correctCount || 0) + 1;
              if (t.totalCount >= 3 && (t.correctCount / t.totalCount) >= 0.8) t.status = 'Знаю';
            }
          }

          if (item.mistakeId) {
            const res = handleMistakePracticeResult(item.mistakeId, isCorrect);
            if (res.removed) showToast('Карточка убрана из Mistakes (2/2)!', 'success');
          } else {
            const mPayload = isCorrect ? null : { section: item.section, itemId: item.itemId, exerciseId: item.exerciseId, prompt: item.prompt, expected: item.answer, hint: item.hint };
            if (mPayload) s.mistakesList.push(mPayload);
            recordAnswer(isCorrect, mPayload);
          }
        },

        nextSessionItem() {
          const s = ui.session;
          if (!s) return;
          s.index += 1;
          s.flipped = false;
          s.answered = false;
          s.inputValue = '';
          s.selectedOption = null;

          // On completion of full Today block or Control Test
          if (s.index >= s.items.length) {
            if (s.isTodayFull) {
              markTodayCompleted();
              showToast('Блок Today выполнен! День засчитан!', 'success');
            }
            if (s.isControlTest) {
              const total = s.items.length || 1;
              const pct = Math.round((s.score / total) * 100);
              state.testsHistory.unshift({
                id: uid('test'),
                date: getDateKey(),
                scopeLabel: s.scopeLabel,
                score: s.score,
                total,
                percent: pct,
                mistakesCount: s.mistakesList.length
              });
              saveState();
            }
          }
          renderMain();
        },

        exitSession() {
          ui.session = null;
          renderMain();
        },
