              <div class="font-extrabold text-sm">Gemini API для авторазбора конспектов</div>
              <div>
                <label class="block text-xs font-bold text-[#6E717A] mb-1">Gemini API Key (синхронизируется в ваш личный Firestore)</label>
                <input id="cfg-gemini-key" type="password" class="input-soft text-xs" value="${escapeHtml(config.geminiApiKey || '')}" placeholder="AIza..." />
              </div>
              <details class="bg-[#FAF9F6] rounded-2xl p-3">
                <summary class="text-xs font-bold text-[#6E717A] cursor-pointer">Firebase уже встроен (нажмите, чтобы изменить конфиг)</summary>
                <textarea id="cfg-firebase-json" class="input-soft !bg-white text-xs font-mono mt-2" rows="3" placeholder="Оставьте пустым для встроенного проекта">${escapeHtml(config.firebaseConfigText || '')}</textarea>
              </details>
              <div class="flex justify-between items-center gap-2 flex-wrap pt-1">
                <div class="flex gap-2">
                  <button type="button" onclick="App.exportBackupJson()" class="btn-soft text-xs">💾 Бэкап JSON</button>
                  <button type="button" onclick="App.resetAllData()" class="btn-soft !bg-[#FDECEB] !text-[#C84444] text-xs">🗑️ Очистить</button>
                </div>
                <div class="flex gap-2">
                  <button type="button" onclick="App.closeModal()" class="btn-soft">Закрыть</button>
                  <button type="button" onclick="App.saveIntegrationsConfig()" class="btn-primary">Сохранить</button>
                </div>
              </div>
            </div>
          `);
        },

        async signInWithGoogle() {
          if (!ui.fbAuth) {
            showToast('Сначала вставьте Firebase Config и нажмите «Подключить / Сохранить»', 'error');
            return;
          }
          try {
            const provider = new window.firebase.auth.GoogleAuthProvider();
            await ui.fbAuth.signInWithPopup(provider);
            closeModal();
          } catch (err) {
            if (err && (err.code === 'auth/popup-blocked' || err.code === 'auth/operation-not-supported-in-this-environment')) {
              try {
                const provider = new window.firebase.auth.GoogleAuthProvider();
                await ui.fbAuth.signInWithRedirect(provider);
              } catch (e2) {
                showToast('Ошибка входа Google: ' + (e2.message || e2.code), 'error');
              }
            } else {
              showToast('Ошибка входа Google: ' + (err.message || err.code), 'error');
            }
          }
        },

        async signInWithEmail() {
          const email = (document.getElementById('auth-email').value || '').trim();
          const pass = (document.getElementById('auth-pass').value || '').trim();
          if (!email || !pass) return;
          if (!ui.fbAuth) {
            showToast('Сначала подключите Firebase Config ниже', 'error');
            return;
          }
          try {
            await ui.fbAuth.signInWithEmailAndPassword(email, pass);
            closeModal();
          } catch (err) {
            showToast('Ошибка входа: ' + (err.message || err.code), 'error');
          }
        },

        async registerWithEmail() {
          const email = (document.getElementById('auth-email').value || '').trim();
          const pass = (document.getElementById('auth-pass').value || '').trim();
          if (!email || pass.length < 6) {
            showToast('Введите Email и пароль от 6 символов', 'error');
            return;
          }
          if (!ui.fbAuth) {
            showToast('Сначала подключите Firebase Config ниже', 'error');
            return;
          }
          try {
            await ui.fbAuth.createUserWithEmailAndPassword(email, pass);
            closeModal();
            showToast('Аккаунт создан!', 'success');
          } catch (err) {
            showToast('Ошибка регистрации: ' + (err.message || err.code), 'error');
          }
        },

        async signOut() {
          try {
            if (ui.fbAuth && ui.fbAuth.currentUser) {
              await ui.fbAuth.signOut();
            }
          } catch (_) {}
          state.user = { signedIn: false, uid: '', name: 'Гость', email: '', provider: 'local' };
          ui.syncState = ui.fbAuth ? 'ready' : 'local';
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {}
          closeModal();
          renderMain();
          showToast('Вы вышли из аккаунта');
        },

        saveIntegrationsConfig() {
          config.geminiApiKey = (document.getElementById('cfg-gemini-key').value || '').trim();
          const fbEl = document.getElementById('cfg-firebase-json');
          config.firebaseConfigText = fbEl ? fbEl.value.trim() : '';
          saveConfig();
          initFirebaseFromConfig(true);
          syncToFirebaseIfConnected();
          closeModal();
          showToast('Настройки сохранены и синхронизированы', 'success');
        },

        resetAllData() {
          state = createInitialState();
          saveState();
          closeModal();
          renderMain();
          showToast('Все данные очищены');
        },

        exportBackupJson() {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `english-every-day-backup-${getDateKey()}.json`;
          a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
      };

      // =========================================================================
      // BOOTSTRAP
      // =========================================================================
      function toggleAccent() {
        state.settings.accent = state.settings.accent === 'en-US' ? 'en-GB' : 'en-US';
        saveState();
        renderMain();
        showToast(`Акцент озвучки: ${state.settings.accent}`);
      }
      document.getElementById('accent-toggle-btn').addEventListener('click', toggleAccent);
      document.getElementById('brand-flag-btn').addEventListener('click', toggleAccent);

      document.getElementById('sync-status-btn').addEventListener('click', () => App.openAccountModal());
      document.getElementById('account-btn').addEventListener('click', () => App.openAccountModal());
      document.getElementById('general-lessons-btn').addEventListener('click', () => App.openGeneralLessons());
      loadLocalGeneralLessons();

      initFirebaseFromConfig(true);
      renderMain();
    })();
  </script>
</body>
</html>
